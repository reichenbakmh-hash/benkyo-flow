name = "benkyo-flow"
main = "worker/index.ts"
compatibility_date = "2024-09-23"

# Sert les fichiers statiques buildés par Vite (npm run build -> dist/).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Workers AI : aucune ressource à créer, aucun ID à récupérer.
# Ce binding suffit à activer l'assistant IA après un simple redéploiement.
[ai]
binding = "AI"

# Base de données D1 : nécessaire pour les comptes (login) et la
# synchronisation des données. Sans ce binding, l'app fonctionne quand même
# en mode local (localStorage), mais sans comptes.
#
# Étapes :
#   1. npx wrangler d1 create benkyo-flow-db
#   2. Copier le "database_id" retourné ci-dessous
#   3. npx wrangler d1 execute benkyo-flow-db --remote --file=./schema.sql
#   4. git commit + push (ou redéployer depuis le dashboard Cloudflare)
#
[[d1_databases]]
binding = "DB"
database_name = "benkyo-flow-db"
database_id = "79a9c336-90a9-4992-881d-968b7e33d730"
