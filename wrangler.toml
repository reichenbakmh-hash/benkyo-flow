name = "benkyo-flow"
main = "worker/index.ts"
compatibility_date = "2024-09-23"

# Sert les fichiers statiques buildés par Vite (npm run build -> dist/).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Base de données D1, optionnelle pour la V1 (l'app fonctionne sans,
# via localStorage). Décommenter et renseigner l'ID après :
#   wrangler d1 create benkyo-flow-db
#   wrangler d1 execute benkyo-flow-db --file=./schema.sql
#
[[d1_databases]]
binding = "DB"
database_name = "benkyo-flow-db"
database_id = "79a9c336-90a9-4992-881d-968b7e33d730"
