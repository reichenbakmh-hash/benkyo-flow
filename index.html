<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6D28D9" />
    <meta name="description" content="Benkyō Flow — l'espace d'organisation scolaire des lycéens et étudiants." />
    <title>Benkyō Flow</title>

    <!--
      Police "Outfit" (géométrique, énergique, très lisible) via Google
      Fonts. Chargement non bloquant : si hors-ligne ou lent, la pile de
      secours système (déjà définie dans index.css) prend le relais sans
      casser l'affichage.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!--
      Anti-flash de thème : on lit la préférence AVANT que React ne monte,
      pour éviter un flash clair->sombre au chargement.
      Ce script est volontairement autonome (aucune dépendance externe).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("benkyo-flow:theme");
          var mode = stored || "system";
          var isDark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            isDark ? "dark" : "light"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
