<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6f5e" />
    <meta name="description" content="Benkyō Flow — l'espace d'organisation scolaire des lycéens et étudiants." />
    <title>Benkyō Flow</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!--
      Anti-flash de thème : on lit la préférence AVANT que React ne monte,
      pour éviter un flash clair->sombre au chargement.
      Ce script est volontairement autonome (aucune dépendance externe).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("benkyo-flow:theme");
          var mode = stored || "system";
          var isDark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            isDark ? "dark" : "light"
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
